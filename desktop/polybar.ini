[colors]
bg = #0A0A0B
surface = #111113
hairline = #232326
text = #E8E8EA
muted = #6E6E76
accent = #FF4D00

[bar/mim]
width = 100%
height = 28
offset-x = 0
offset-y = 0
fixed-center = true
bottom = false

background = ${colors.bg}
foreground = ${colors.text}

border-bottom-size = 1
border-bottom-color = ${colors.hairline}

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = Inter:style=Medium:size=9;2
font-1 = JetBrains Mono:size=9;2

modules-left = identity
modules-center = mim-status
modules-right = model tokens clock

wm-restack = bspwm
enable-ipc = true

[module/identity]
type = custom/text
content = MIM %{F#6E6E76}| agent%{F-}

[module/mim-status]
type = custom/script
exec = /usr/local/share/mim/desktop/mim-status.sh status
interval = 1
format-font = 2

[module/model]
type = custom/script
exec = /usr/local/share/mim/desktop/mim-status.sh model
interval = 2
format-foreground = ${colors.muted}
format-font = 2

[module/tokens]
type = custom/script
exec = /usr/local/share/mim/desktop/mim-status.sh tokens
interval = 2
format-foreground = ${colors.muted}
format-font = 2

[module/clock]
type = internal/date
interval = 10
date = %H:%M
format-foreground = ${colors.muted}
format-font = 2
